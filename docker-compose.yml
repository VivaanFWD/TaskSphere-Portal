version: '3.8'

services:
  tasksphere-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tasksphere-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
      # Point to your deployed auth-service (URL or Docker service name):
      - AUTH_SERVICE_BASE_URL=${AUTH_SERVICE_BASE_URL:-http://host.docker.internal:8081}
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID:-tasksphere-app}
      - AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET:-TS_CLIENT_4nH8kP2xV6mQ9wR3zA7cD1fG5jL0sB_EuYtWpXqMzK8rN6vC4aF}
      - AUTH_ADMIN_API_KEY=${AUTH_ADMIN_API_KEY:-TMSDL_MZ-hAh1b9aBSQfQvzosrDMUdhLUOh2o1zUCm5LzlnOTqGQK7ku8A_1gYPi}
      # Database connection (Neon PostgreSQL / Cloud DB)
      - APP_DB_URL=${APP_DB_URL:-jdbc:postgresql://ep-royal-rain-b5u9jryu-pooler.c-7.us-east-2.aws.neon.tech/tasksphere_db?sslmode=require&channel_binding=require}
      - APP_DB_USERNAME=${APP_DB_USERNAME:-neondb_owner}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-npg_SH8qv3kpcdZr}
      - SESSION_COOKIE_SECURE=false
      - UPLOAD_DIR=/app/uploads
    volumes:
      - tasksphere_uploads:/app/uploads
    networks:
      - tasksphere-net

volumes:
  tasksphere_uploads:

networks:
  tasksphere-net:
    driver: bridge
