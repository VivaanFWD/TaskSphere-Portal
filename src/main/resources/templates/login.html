<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TaskSphere</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-bg d-flex align-items-center justify-content-center">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4 ts-auth-card mx-auto">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="ts-auth-icon"><i class="bi bi-check2-square"></i></div>
                        <h2 class="h3 fw-bold mt-3">TaskSphere Login</h2>
                        <p class="text-muted small">Sign in to continue to your academic workspace.</p>
                    </div>
                    <div th:if="${loginError or errorMessage != null}" class="alert alert-danger">
                        <span th:text="${errorMessage} ?: 'Invalid username or password'">Invalid username or password</span>
                    </div>
                    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
                    <form method="post" th:action="@{/login}">
                        <div class="mb-3">
                            <label class="form-label" for="username">User ID</label>
                            <input id="username" type="text" class="form-control" name="username" autocomplete="username" required placeholder="Your TaskSphere user ID">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input id="password" type="password" class="form-control" name="password" autocomplete="current-password" required>
                        </div>
                        <button class="btn btn-ts-primary w-100 py-2" type="submit"><i class="bi bi-box-arrow-in-right me-1"></i>Login</button>
                        <p class="mt-3 mb-0 small"><a th:href="@{/account-recovery}">Forgot your password or user ID?</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
