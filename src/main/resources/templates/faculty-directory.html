<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty directory | TaskSphere</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary px-3">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">TaskSphere</a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <a class="btn btn-outline-light btn-sm" th:href="@{/courses}">My courses</a>
            <span class="text-white" th:text="${user.username}">User</span>
            <form method="post" th:action="@{/logout}" class="m-0"><button class="btn btn-outline-light btn-sm">Logout</button></form>
        </div>
    </div>
</nav>
<main class="container py-4">
    <a th:href="@{/dashboard}" class="btn btn-link px-0">&larr; Dashboard</a>
    <h1 class="h3">Faculty information</h1>
    <p class="text-muted">Search faculty by name, user ID, department, or school. Select a profile to view contact details and open hours.</p>
    <form method="get" th:action="@{/faculty}" class="row g-2 mb-4">
        <div class="col-sm-9 col-md-6">
            <label class="visually-hidden" for="faculty-search">Search faculty</label>
            <input id="faculty-search" class="form-control" name="search" maxlength="120"
                   placeholder="Search faculty name or department" th:value="${search}">
        </div>
        <div class="col-auto"><button class="btn btn-primary">Search</button></div>
        <div class="col-auto"><a class="btn btn-outline-secondary" th:href="@{/faculty}">Clear</a></div>
    </form>
    <div th:if="${#lists.isEmpty(faculty)}" class="alert alert-light border">No active faculty matched this search.</div>
    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="member : ${faculty}">
            <article class="card shadow-sm h-100">
                <div class="card-body">
                    <h2 class="h5 mb-1" th:text="${member.firstName + ' ' + member.lastName}">Faculty name</h2>
                    <p class="text-muted small mb-2" th:text="${member.username}">Faculty ID</p>
                    <p class="mb-1" th:text="${member.designation != '' ? member.designation : 'Faculty'}"></p>
                    <p class="small text-muted mb-3"
                       th:text="${member.department + (member.school != '' ? ' · ' + member.school : '')}"></p>
                    <a class="btn btn-outline-primary btn-sm"
                       th:href="@{/faculty/{username}(username=${member.username})}">View faculty information</a>
                </div>
            </article>
        </div>
    </div>
</main>
</body>
</html>
