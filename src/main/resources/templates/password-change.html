<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change password | TaskSphere</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-bg d-flex align-items-center justify-content-center">
<main class="container">
    <div class="row justify-content-center"><div class="col-md-6 col-lg-5">
        <section class="card border-0 shadow-lg rounded-4"><div class="card-body p-4 p-md-5">
            <h1 class="h3 mb-2">Set your password</h1>
            <p class="text-muted">You must replace your initial password before continuing.</p>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
            <form method="post" th:action="@{/password/change}">
                <div class="mb-3"><label class="form-label" for="currentPassword">Current password</label><input class="form-control" id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required></div>
                <div class="mb-3"><label class="form-label" for="newPassword">New password</label><input class="form-control" id="newPassword" name="newPassword" type="password" minlength="12" autocomplete="new-password" required></div>
                <div class="mb-3"><label class="form-label" for="confirmPassword">Confirm new password</label><input class="form-control" id="confirmPassword" name="confirmPassword" type="password" minlength="12" autocomplete="new-password" required></div>
                <button class="btn btn-primary w-100" type="submit">Change password</button>
            </form>
        </div></section>
    </div></div>
</main>
</body>
</html>
