<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark ts-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/dashboard}">
                <i class="bi bi-check2-square me-2"></i>TaskSphere
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#taskSphereNav"
                    aria-controls="taskSphereNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="taskSphereNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                    <li class="nav-item" th:if="${workspaceRole == 'STUDENT' or workspaceRole == 'FACULTY'}">
                        <a class="nav-link" th:href="@{/task-analytics}"><i class="bi bi-graph-up me-1"></i>Analytics</a>
                    </li>
                    <li class="nav-item" th:if="${workspaceRole == 'FACULTY'}">
                        <a class="nav-link" th:href="@{/courses}">My courses</a>
                    </li>
                    <li class="nav-item" th:if="${workspaceRole == 'STUDENT'}">
                        <a class="nav-link" th:href="@{/courses}">My courses</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/faculty}">Faculty directory</a>
                    </li>
                    <li class="nav-item" th:if="${workspaceRole == 'FACULTY'}">
                        <a class="nav-link" th:href="@{/faculty/profile}">My profile</a>
                    </li>
                    <li class="nav-item">
                        <span class="nav-link text-white-50"><i class="bi bi-person-circle me-1"></i><span th:text="${user}">User</span></span>
                    </li>
                    <li class="nav-item">
                        <form method="post" th:action="@{/logout}" class="m-0">
                            <button type="submit" class="btn btn-outline-light btn-sm ms-lg-2 px-3">
                                <i class="bi bi-box-arrow-right me-1"></i>Logout
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
