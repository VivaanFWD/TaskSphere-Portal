spring:
  datasource:
    url: ${APP_DB_URL}
    username: ${APP_DB_USERNAME}
    password: ${APP_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

app:
  auth-service-base-url: ${AUTH_SERVICE_BASE_URL}
  auth-admin-api-key: ${AUTH_ADMIN_API_KEY}
  auth-client-id: ${AUTH_CLIENT_ID}
  auth-client-secret: ${AUTH_CLIENT_SECRET}

server:
  port: ${PORT:${APP_SERVER_PORT:8080}}
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
