    # password: ${APP_DB_PASSWORD:Vivaan@2050}
    driver-class-name: ${APP_DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_app
    baseline-on-migrate: true
    baseline-version: 0
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
  mail:
    host: localhost
    port: 1025
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

app:
  auth-service-base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}
  auth-admin-api-key: ${AUTH_ADMIN_API_KEY:TMSDL_MZ-hAh1b9aBSQfQvzosrDMUdhLUOh2o1zUCm5LzlnOTqGQK7ku8A_1gYPi}
  # auth-admin-api-key: ${AUTH_ADMIN_API_KEY:}
